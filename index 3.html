<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>

<script>
  // ============================================
  // CONFIG: put the destination URL here
  // ============================================
  const REDIRECT_URL = "https://example.com";
  // ============================================

  window.location.replace(REDIRECT_URL);
</script>

<meta http-equiv="refresh" content="0; url=https://example.com">
</head>
<body>
  <p>Redirecting... if you are not redirected automatically, <a id="fallback-link" href="https://example.com">click here</a>.</p>

  <script>
    // keep the fallback link/meta tag in sync with the config value above
    document.getElementById('fallback-link').href = REDIRECT_URL;
  </script>
</body>
</html>
